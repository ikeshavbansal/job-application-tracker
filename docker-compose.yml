services:
    db:
        image: postgres:16-alpine
        env_file: .env
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    backend:
        build: .
        env_file: .env
        environment:
            RUN_MIGRATIONS: "true"
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/app
        ports:
            - "8000:8000"
        depends_on:
            - db
            - redis
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
            interval: 5s
            timeout: 3s
            retries: 10
            start_period: 30s

    worker:
        build: .
        env_file: .env
        command: celery -A core worker --loglevel=info
        volumes:
            - .:/app
        depends_on:
            backend:
                condition: service_healthy

    beat:
        build: .
        env_file: .env
        command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        volumes:
            - .:/app
        depends_on:
            backend:
                condition: service_healthy

    frontend:
        build: ./frontend
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        depends_on:
            - backend

volumes:
    postgres_data:
